version: 2

# Keys and relationships are tested on the staging models (see _staging.yml),
# so each check runs once.
seeds:
  - name: estados
    description: States (UF) with region. Master data, copied unchanged from the original project.
  - name: cidades
    description: Cities with their UF.
  - name: categorias_loja
    description: Store categories (VAREJO, ATACADO, ATACAREJO).
  - name: redes
    description: Store chains.
  - name: lojas
    description: Stores (PDV) with foreign keys to city, category and chain.
  - name: categorias
    description: Product categories.
  - name: produtos
    description: Products. Carries the brand as an attribute (id_marca, marca).
  - name: preco_sugerido
    description: Suggested price per product x store category, with tolerance band. Copied unchanged from the original project.
  - name: sku_prioridade
    description: Expected weekly turnover and must-have flag per product x store category.
  - name: meta_share
    description: Shelf share goal (%) per brand x store category.
  - name: verdade_plantada
    description: >
      Answer key of the effects the synthetic generator planted, one row per store.
      Not business data: only the singular test verdade_plantada reads it. Built
      outside prod only. Regenerate with generator/export_verdade_plantada.py.
    config:
      enabled: "{{ target.name != 'prod' }}"
      column_types:
        critica: boolean
        rede_ruptura: boolean
        rede_guerra_preco: boolean
        rede_excelencia: boolean
